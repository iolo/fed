[package]
name = "fed"
version = "0.1.0"
description = "A bitmap font editor for retro computing"
authors = ["iolo"]
edition = "2021"

[lib]
name = "fed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

